<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotationstrainer L1-L6 v6.4</title><style>:root{--b:#77cde8;--g:#00df18}*{box-sizing:border-box}body{margin:0;background:#eef3f6;font:16px system-ui;color:#17212b}.app{max-width:1120px;margin:auto;padding:18px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0}button{padding:9px 13px;border:1px solid #bfd0da;border-radius:9px;background:#fff;font-weight:700;cursor:pointer}button.on{background:#176c86;color:#fff}.play{background:#14804a;color:#fff}.grid{display:grid;grid-template-columns:minmax(0,735px) 1fr;gap:15px}.card{background:#fff;padding:13px;border-radius:15px;box-shadow:0 4px 17px #2342}svg{width:100%;height:auto}.court{fill:#fff;stroke:var(--b);stroke-width:6}.line{stroke:var(--b);stroke-width:5}.net{stroke:#263640;stroke-width:10}.bad{stroke:var(--g);stroke-width:7;stroke-linecap:round}.zone circle{fill:#fff;stroke:#dbe5ea}.zone text{font:800 38px system-ui;fill:#6b8290;text-anchor:middle;dominant-baseline:middle}.p circle{stroke:#263640;stroke-width:3}.p text{font:900 22px system-ui;text-anchor:middle;dominant-baseline:middle}.p{filter:drop-shadow(0 3px 3px #0002)}.path{fill:none;stroke:#9aabb5;stroke-width:5;stroke-dasharray:10 8}.path.z{stroke:#75bd43}.x{font:900 43px system-ui;fill:var(--g)}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:700}.dot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-right:4px;border:1px solid #667}.status{font-weight:800;color:#176c86}.hint{padding:10px;background:#f1faf3;border-left:4px solid #73c978;border-radius:7px}.seq{font-weight:800;color:#7a3d00}.modebar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}.modebtn{font-size:15px}.rolebar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.rolebtn{padding:7px 10px}.test-controls{display:none;gap:8px;flex-wrap:wrap;margin-top:12px}.test-controls.show{display:flex}.feedback{min-height:28px;margin-top:10px;font-weight:800}.feedback.ok{color:#14804a}.feedback.bad{color:#b42318}.draggable{cursor:grab}.draggable.dragging{cursor:grabbing}.ghost{opacity:.16}.selected circle{stroke:#17212b;stroke-width:6}.mode-note{font-size:14px;color:#536270;margin:4px 0 10px}.bench-label{font:700 17px system-ui;fill:#536270}.teamdrag{cursor:grab}.teamdrag circle{stroke-width:4}@media(max-width:820px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>Rotationstrainer 5:1</h1><div>Damen 4 · alle Läuferpositionen · v6.4</div><div class="modebar"><button class="modebtn on" data-mode="setup">👁 Zeig mir die Aufstellung</button><button class="modebtn" data-mode="paths">▶ Zeig mir die Laufwege</button><button class="modebtn" data-mode="test">🎯 Teste mich</button></div><div id="modeNote" class="mode-note"></div><div class="bar" id="rots"></div><div class="bar"><button id="serve" class="on">Eigener Aufschlag</button><button id="receive">Annahme</button><button id="reset">Ausgangsposition</button><button id="play" class="play">▶ Laufwege</button></div><div class="rolebar" id="roles"></div><div class="grid"><section class="card"><svg viewBox="0 0 900 875"><rect class="court" x="90" y="65" width="720" height="720"/><line class="net" x1="72" y1="65" x2="828" y2="65"/><line class="line" x1="90" y1="305" x2="810" y2="305"/><line class="bad" x1="290" y1="290" x2="290" y2="320"/><line class="bad" x1="610" y1="290" x2="610" y2="320"/><g class="zone"><g transform="translate(145 125)"><circle r="29"/><text>4</text></g><g transform="translate(450 125)"><circle r="29"/><text>3</text></g><g transform="translate(755 125)"><circle r="29"/><text>2</text></g><g transform="translate(170 650)"><circle r="29"/><text>5</text></g><g transform="translate(450 650)"><circle r="29"/><text>6</text></g><g transform="translate(730 650)"><circle r="29"/><text>1</text></g></g><text class="x" x="520" y="155">X</text><g id="paths"></g><g id="players"></g></svg><div class="legend"><span><i class="dot" style="background:#75bd43"></i>Z</span><span><i class="dot" style="background:#fff22b"></i>D</span><span><i class="dot" style="background:#f3b51b"></i>MB</span><span><i class="dot" style="background:#9ecbf0"></i>AA1/AA2</span><span><i class="dot" style="background:#c98783"></i>L</span></div></section><aside class="card"><div id="status" class="status"></div><h2 id="title"></h2><div id="txt"></div><div id="testControls" class="test-controls"><button id="singleTest" class="on">Wo stehst du?</button><button id="teamTest">Stelle die gesamte Mannschaft auf</button><button id="newTask">Neue Aufgabe</button><button id="check">✓ Prüfen</button><button id="solution">💡 Lösung anzeigen</button></div><div id="feedback" class="feedback"></div></aside></div></main><script>
const C={Z:'#75bd43',D:'#fff22b',MB1:'#f3b51b',MB2:'#f3b51b',AA1:'#9ecbf0',AA2:'#9ecbf0',L:'#c98783'};
const P={FL:[200,108],FM:[450,108],FR:[700,108],RFL:[200,265],RFM:[450,265],RFR:[700,265],R5:[290,345],R1:[610,345],R6:[450,610],AL:[280,460],AM:[450,460],AR:[650,460],SL:[200,185],SM:[450,185],SR:[675,185],X:[535,145],O1:[750,827],O6:[450,827],O5:[170,827]};
const d={
L1:{serve:{s:{D:P.FL,MB1:P.FM,AA1:P.FR,AA2:[300,455],L:[570,455],Z:P.O1},e:{AA1:P.FL,MB1:P.FM,D:P.FR,L:P.R5,Z:P.R1,AA2:P.R6}},receive:{s:{D:P.SL,MB1:P.SM,AA1:P.AR,AA2:P.AL,L:P.AM,Z:[760,500]},e:{D:P.RFL,MB1:P.RFM,AA1:P.RFR,L:P.R5,Z:P.X,AA2:P.R6},seq:['Z','AA1']}},
L6:{serve:{s:{AA2:P.FL,D:P.FM,MB1:P.FR,L:[330,470],Z:[590,470],AA1:P.O6},e:{AA2:P.FL,MB1:P.FM,D:P.FR,L:P.R5,Z:P.R1,AA1:P.R6}},receive:{s:{AA2:P.AL,L:P.AM,AA1:P.AR,Z:[575,185],D:[695,108],MB1:[765,185]},e:{AA2:P.RFL,MB1:P.RFM,D:P.RFR,L:P.R5,Z:P.X,AA1:P.R6}}},
L5:{serve:{s:{MB2:P.FL,AA2:P.FM,D:P.FR,Z:[290,470],AA1:[590,470],MB1:P.O5},e:{AA2:P.FL,MB2:P.FM,D:P.FR,MB1:P.R5,Z:P.R1,AA1:P.R6}},receive:{s:{MB2:P.FL,Z:[310,185],D:P.FR,AA2:P.AL,AA1:P.AM,L:P.AR},e:{AA2:P.RFL,MB2:P.RFM,D:P.RFR,L:P.R5,Z:P.X,AA1:P.R6}}},
L4:{serve:{s:{Z:P.FL,MB2:P.FM,AA2:P.FR,AA1:[310,470],L:[590,470],D:P.O1},e:{AA2:P.FL,MB2:P.FM,Z:P.FR,L:P.R5,D:P.R1,AA1:P.R6}},receive:{s:{Z:[120,108],MB2:[170,185],AA2:P.AL,AA1:P.AM,L:P.AR,D:[745,650]},e:{AA2:P.RFL,MB2:P.RFM,Z:P.X,L:P.R5,D:P.R1,AA1:P.R6},seq:['Z','MB2','AA2']}},
L3:{serve:{s:{AA1:P.FL,Z:P.FM,MB2:P.FR,L:[330,470],D:[570,470],AA2:P.O6},e:{AA1:P.FL,MB2:P.FM,Z:P.FR,L:P.R5,D:P.R1,AA2:P.R6}},receive:{s:{Z:[550,145],MB2:[755,185],AA1:P.AL,L:P.AM,AA2:P.AR,D:[550,610]},e:{AA1:P.RFL,MB2:P.RFM,Z:P.X,L:P.R5,D:P.R1,AA2:P.R6}}},
L2:{serve:{s:{MB1:P.FL,AA1:P.FM,Z:P.FR,D:[300,470],AA2:[590,470],MB2:P.O5},e:{AA1:P.FL,MB1:P.FM,Z:P.FR,MB2:P.R5,D:P.R1,AA2:P.R6}},receive:{s:{MB1:[135,145],Z:[555,145],AA1:P.AL,AA2:P.AM,L:P.AR,D:[330,610]},e:{AA1:P.RFL,MB1:P.RFM,Z:P.X,AA2:P.R5,D:P.R1,L:P.R6}}}};
let rot='L1',mode='serve',viewMode='setup',role='Alle',testRole=null,drag=null,testType='single';
const ps=document.querySelector('#players'),paths=document.querySelector('#paths');
const rotsEl=document.getElementById('rots'),rolesEl=document.getElementById('roles');
const serveBtn=document.getElementById('serve'),receiveBtn=document.getElementById('receive'),resetBtn=document.getElementById('reset'),playBtn=document.getElementById('play');
const testControlsEl=document.getElementById('testControls'),feedbackEl=document.getElementById('feedback'),statusEl=document.getElementById('status'),titleEl=document.getElementById('title'),txtEl=document.getElementById('txt'),modeNoteEl=document.getElementById('modeNote');
const newTaskBtn=document.getElementById('newTask'),checkBtn=document.getElementById('check'),solutionBtn=document.getElementById('solution'),singleTestBtn=document.getElementById('singleTest'),teamTestBtn=document.getElementById('teamTest');
for(const r of ['L1','L6','L5','L4','L3','L2']){let b=document.createElement('button');b.textContent=r;b.id='r'+r;b.onclick=()=>{rot=r;document.querySelectorAll('#rots button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(viewMode==='test')newTest();else render()};rotsEl.append(b)}document.getElementById('rL1').classList.add('on');
for(const r of ['Alle','Z','D','MB','AA1','AA2','L']){let b=document.createElement('button');b.textContent=r;b.className='rolebtn'+(r==='Alle'?' on':'');b.onclick=()=>{role=r;document.querySelectorAll('#roles button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(viewMode==='test'){if(testType==='team')prepareTeamTest();else{testRole=r==='Alle'?resolveRole(Object.keys(d[rot][mode].s)[0]):resolveRole(r);prepareTest()}}else render()};rolesEl.append(b)}
document.querySelectorAll('.modebtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modebtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');viewMode=b.dataset.mode;paths.innerHTML='';testControlsEl.classList.toggle('show',viewMode==='test');playBtn.style.display=viewMode==='paths'?'inline-block':'none';resetBtn.textContent=viewMode==='setup'?'Spielposition':'Ausgangsposition';if(viewMode==='test')newTest();else render()});
function resolveRole(r){if(r!=='MB')return r;return Object.keys(d[rot][mode].s).find(x=>x.startsWith('MB'))}
function roleMatches(id){return role==='Alle'||(role==='MB'?id.startsWith('MB'):id===role)}
function player(id,p,extra=''){let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.classList.add('p');if(extra)extra.split(/\s+/).filter(Boolean).forEach(cls=>g.classList.add(cls));g.id='p'+id;g.dataset.id=id;g.setAttribute('transform',`translate(${p[0]} ${p[1]})`);g.style.transition='transform 2.2s cubic-bezier(.45,.05,.22,1)';let c=document.createElementNS(g.namespaceURI,'circle');c.setAttribute('r',40);c.setAttribute('fill',C[id]);let t=document.createElementNS(g.namespaceURI,'text');t.textContent=id;g.append(c,t);ps.append(g);return g}
function filtered(id){return !roleMatches(id)}
function render(end=false){ps.innerHTML='';paths.innerHTML='';let src=end?d[rot][mode].e:d[rot][mode].s;for(const [id,p] of Object.entries(src)){let g=player(id,p,filtered(id)?'ghost':'');if(!filtered(id)&&role!=='Alle')g.classList.add('selected')}info(end)}
function curve(a,b,id){return mode==='receive'&&id==='Z'&&a[0]>700?`M${a[0]} ${a[1]} C835 400,820 150,${b[0]} ${b[1]}`:`M${a[0]} ${a[1]} L${b[0]} ${b[1]}`}
function move(go){if(viewMode==='setup'){render(go);resetBtn.textContent=go?'Ausgangsposition':'Spielposition';resetBtn.onclick=()=>{render(!go);resetBtn.textContent=!go?'Ausgangsposition':'Spielposition'};return}paths.innerHTML='';if(go)for(const id in d[rot][mode].s){if(filtered(id))continue;let a=d[rot][mode].s[id],b=d[rot][mode].e[id],p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',curve(a,b,id));p.setAttribute('class','path '+(id==='Z'?'z':''));paths.append(p)}let seq=d[rot][mode].seq||[];for(const id in d[rot][mode].s){let el=document.querySelector('#p'+id);if(!el)continue;let p=go?d[rot][mode].e[id]:d[rot][mode].s[id];el.style.transitionDelay=go&&seq.includes(id)?seq.indexOf(id)*.5+'s':go&&mode==='receive'?'.15s':'0s';el.setAttribute('transform',`translate(${p[0]} ${p[1]})`)}info(go)}
function svgPoint(evt){let pt=document.querySelector('svg').createSVGPoint();pt.x=evt.clientX;pt.y=evt.clientY;return pt.matrixTransform(document.querySelector('svg').getScreenCTM().inverse())}
function prepareTest(){ps.innerHTML='';paths.innerHTML='';feedbackEl.textContent='';let targets=d[rot][mode].s;for(const [id,p] of Object.entries(targets)){if(id===testRole)continue;player(id,p,'ghost')}let g=player(testRole,[850,700],'draggable');attachDrag(g);info(false)}
function attachDrag(g){g.style.transition='none';g.addEventListener('pointerdown',e=>{drag=g;g.setPointerCapture(e.pointerId);g.classList.add('dragging')});g.addEventListener('pointermove',e=>{if(drag!==g)return;let p=svgPoint(e);g.setAttribute('transform',`translate(${Math.max(45,Math.min(855,p.x))} ${Math.max(45,Math.min(830,p.y))})`)});g.addEventListener('pointerup',()=>{drag=null;g.classList.remove('dragging')})}
function newTest(){if(testType==='team'){prepareTeamTest();return}let keys=Object.keys(d[rot][mode].s);testRole=role==='Alle'?keys[Math.floor(Math.random()*keys.length)]:resolveRole(role);prepareTest()}
function prepareTeamTest(){ps.innerHTML='';paths.innerHTML='';feedbackEl.textContent='';let keys=Object.keys(d[rot][mode].s);let bench=[[60,720],[160,720],[260,720],[640,720],[740,720],[840,720]];keys.forEach((id,i)=>{let g=player(id,bench[i],'draggable teamdrag');attachDrag(g)});info(false)}
function checkTeam(){let targets=d[rot][mode].s,ok=[],bad=[];for(const id of Object.keys(targets)){let p=posOf(document.querySelector('#p'+id)),t=targets[id],dist=Math.hypot(p[0]-t[0],p[1]-t[1]);(dist<=65?ok:bad).push(id)}feedbackEl.className='feedback '+(bad.length?'bad':'ok');feedbackEl.textContent=bad.length?`Noch nicht: ${bad.join(', ')}. Richtig stehen bereits: ${ok.length?ok.join(', '):'keine'}.`:'✓ Richtig! Die gesamte Mannschaft steht korrekt.'}
function showTeamSolution(){for(const [id,p] of Object.entries(d[rot][mode].s)){let el=document.querySelector('#p'+id);el.style.transition='transform .8s';el.setAttribute('transform',`translate(${p[0]} ${p[1]})`)}feedbackEl.className='feedback ok';feedbackEl.textContent='Lösung für die gesamte Mannschaft angezeigt.'}
function posOf(el){let tr=el.getAttribute('transform').match(/[-\d.]+/g).map(Number);return tr}
function checkTest(){let p=posOf(document.querySelector('#p'+testRole)),t=d[rot][mode].s[testRole],dist=Math.hypot(p[0]-t[0],p[1]-t[1]);feedbackEl.className='feedback '+(dist<=65?'ok':'bad');feedbackEl.textContent=dist<=65?'✓ Richtig! Die Ausgangsposition passt.':'Noch nicht richtig. Verschiebe den Kreis näher an die korrekte Ausgangsposition.'}
function showSolution(){let el=document.querySelector('#p'+testRole),p=d[rot][mode].s[testRole];el.style.transition='transform .8s';el.setAttribute('transform',`translate(${p[0]} ${p[1]})`);feedbackEl.className='feedback ok';feedbackEl.textContent='Lösung angezeigt.'}
function info(go){statusEl.textContent=`${rot} · ${mode==='serve'?'Eigener Aufschlag':'Annahme'}${viewMode==='test'?' · Test':''}`;titleEl.textContent=viewMode==='test'?(testType==='team'?'Stelle die gesamte Mannschaft auf':`Wo stehst du? Du bist ${testRole}`):'Läufer '+rot.slice(1);let q=d[rot][mode].seq;txtEl.innerHTML=viewMode==='test'?(testType==='team'?'<p>Ziehe alle sechs Kreise auf die richtigen <strong>Ausgangspositionen</strong> und wähle anschließend „Prüfen“.</p>':'<p>Ziehe deinen Kreis auf die richtige <strong>Ausgangsposition</strong> und wähle anschließend „Prüfen“.</p>'):q&&viewMode==='paths'?`<p class="seq">Bewegungsreihenfolge: ${q.join(' → ')}</p>`:'<p>'+(viewMode==='setup'?'Wechsle direkt zwischen Ausgangs- und Spielposition.':'Direkte, kollisionsarme Laufwege.')+'</p>';modeNoteEl.textContent=viewMode==='setup'?'Statische Aufstellung ansehen und nach Rolle filtern.':viewMode==='paths'?'Laufwege für alle oder eine ausgewählte Rolle abspielen.':(testType==='team'?'Ziehe die gesamte Mannschaft auf die richtigen Ausgangspositionen.':'Ziehe die gefragte Rolle auf ihre richtige Ausgangsposition.')}
serveBtn.onclick=()=>{mode='serve';serveBtn.classList.add('on');receiveBtn.classList.remove('on');viewMode==='test'?newTest():render()};receiveBtn.onclick=()=>{mode='receive';receiveBtn.classList.add('on');serveBtn.classList.remove('on');viewMode==='test'?newTest():render()};resetBtn.onclick=()=>move(false);playBtn.onclick=()=>move(true);newTaskBtn.onclick=newTest;singleTestBtn.onclick=()=>{testType='single';singleTestBtn.classList.add('on');teamTestBtn.classList.remove('on');newTest()};teamTestBtn.onclick=()=>{testType='team';teamTestBtn.classList.add('on');singleTestBtn.classList.remove('on');prepareTeamTest()};checkBtn.onclick=()=>testType==='team'?checkTeam():checkTest();solutionBtn.onclick=()=>testType==='team'?showTeamSolution():showSolution();playBtn.style.display='none';testControlsEl.classList.remove('show');render();</script></body></html>
